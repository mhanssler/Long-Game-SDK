rig:
  name: bench-a
  dut_type: pcba
  instruments:
    - name: main_psu
      expected_manufacturer: RIGOL TECHNOLOGIES
      expected_model: DP832
      expected_serial: DP8C000000000
      connection: USB0::0x1AB1::0x0E11::DP8C000000000::INSTR
      checks:
        - identity
        - calibration_date
        - output_disabled_on_start
        - voltage_limit
        - current_limit
      safety:
        calibration_due: 2027-06-01
        energy_source: true
        channels:
          - channel: CH1
            output_query: ":OUTPut? CH1"
            voltage_limit: {value: 5.5, unit: V}
            voltage_query: ":SOURce1:VOLTage?"
            current_limit: {value: 1.0, unit: A}
            current_query: ":SOURce1:CURRent?"
          - channel: CH2
            output_query: ":OUTPut? CH2"
            voltage_limit: {value: 5.5, unit: V}
            voltage_query: ":SOURce2:VOLTage?"
            current_limit: {value: 1.0, unit: A}
            current_query: ":SOURce2:CURRent?"
          - channel: CH3
            output_query: ":OUTPut? CH3"
            voltage_limit: {value: 5.5, unit: V}
            voltage_query: ":SOURce3:VOLTage?"
            current_limit: {value: 1.0, unit: A}
            current_query: ":SOURce3:CURRent?"
    - name: scope
      expected_manufacturer: RIGOL TECHNOLOGIES
      expected_model: DS1102E
      expected_serial: DS1ZA000000000
      connection: USB0::0x1AB1::0x0588::DS1ZA000000000::INSTR
      checks:
        - identity
        - calibration_date
      safety:
        calibration_due: 2027-06-01
runtime:
  operator: ""
  dut_serial: ""
  output_dir: ./reports/preflight
  required_env:
    - LG_OPERATOR
    - LG_DUT_SERIAL
