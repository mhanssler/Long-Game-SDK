project:
  client: Example Hardware Co.
  project: 800 V BMS HiL Bench
  phase: DVT
  owner: Long Game Technologies

bench:
  name: bms_hil_bench_a
  dut: 800 V BMS controller
  evidence_root: reports/bms-hil
  automation_host: macOS or Linux laptop running long-game-sdk

requirements:
  - BMS-REQ-001
  - BMS-REQ-002

instruments:
  - name: hv_supply
    category: power
    role: pack_voltage_source
    purpose: Simulate battery pack voltage during BMS tests.
    required_optional: required
    quantity: 1
    manufacturer: EA Elektro-Automatik / Magna-Power / Chroma / equivalent
    model: TBD
    control_interface: ethernet
    calibration_required: true
    selection_criteria:
      - Voltage range covers 0-850 V with margin.
      - Remote API supports output enable/disable and OVP/OCP programming.
      - Output defaults off after power cycle or communication loss.
    safety_notes:
      - Set OVP/OCP before enabling output.
      - Output OFF before wiring changes.
    estimated_cost_usd: TBD
    lead_time: TBD
    replacement_option: Lower-voltage supply for early firmware-only tests.
  - name: electronic_load
    category: load
    role: downstream_load
    purpose: Sink controlled current for contactor/fault response checks.
    required_optional: required
    quantity: 1
    manufacturer: Chroma / Rigol / BK Precision / equivalent
    model: TBD
    control_interface: ethernet_or_usb
    calibration_required: true
    selection_criteria:
      - Dynamic load mode supports fault transients.
      - Remote API supports input off command.
    safety_notes:
      - Input OFF before connect/disconnect.
    estimated_cost_usd: TBD
    lead_time: TBD
    replacement_option: Rigol DL3021 for lower-power development.
  - name: can_interface
    category: comms
    role: bms_telemetry
    purpose: Log and command BMS CAN traffic.
    required_optional: required
    quantity: 1
    manufacturer: Kvaser / PEAK / Vector
    model: TBD
    control_interface: usb
    calibration_required: false
    selection_criteria:
      - Good timestamp quality.
      - Python driver support.
      - Isolation preferred.
    safety_notes:
      - Prefer isolated adapter on HV bench.
    estimated_cost_usd: TBD
    lead_time: TBD
    replacement_option: PEAK PCAN-USB for lower-cost setups.

connectors:
  - name: hv_positive
    location: DUT HV input
    family: Amphenol SurLok / equivalent
    mating_connector: TBD
    pin_count: 1
    keying: keyed
    voltage_rating_v: 1000
    current_rating_a: 120
    signal_type: HV power
    cable_type: orange HV cable
    shielding_grounding: chassis bonding per safety review
    strain_relief: fixture clamp
    required_optional: required
    risk_notes: Verify touch-safe cover and creepage/clearance.
  - name: lv_control_header
    location: DUT LV connector
    family: Molex Micro-Fit / equivalent
    mating_connector: TBD
    pin_count: 12
    keying: polarized
    voltage_rating_v: 60
    current_rating_a: 8
    signal_type: LV power, CAN, enables, interlocks
    cable_type: shielded multi-conductor
    shielding_grounding: shield drain to fixture ground
    strain_relief: boot and cable tie
    required_optional: required
    risk_notes: Prevent swapped CAN and enable pins.

safety_controls:
  - All HV sources output OFF before connect/disconnect.
  - Electronic load input OFF before wiring changes.
  - E-stop path verified before energizing DUT.
  - Discharge verification completed before touch.
