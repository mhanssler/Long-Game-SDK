rig:
  name: bms_hil_bench_a
  dut: 800 V BMS controller
  project: 800 V BMS HiL Bench
  client: Example Hardware Co.
  automation_host: macOS or Linux laptop running long-game-sdk
  instruments:
  - name: hv_supply
    role: pack_voltage_source
    category: power
    model: TBD
    control_interface: ethernet
    calibration_required: true
    safety_notes:
    - Set OVP/OCP before enabling output.
    - Output OFF before wiring changes.
  - name: electronic_load
    role: downstream_load
    category: load
    model: TBD
    control_interface: ethernet_or_usb
    calibration_required: true
    safety_notes:
    - Input OFF before connect/disconnect.
  - name: can_interface
    role: bms_telemetry
    category: comms
    model: TBD
    control_interface: usb
    calibration_required: false
    safety_notes:
    - Prefer isolated adapter on HV bench.
connectors:
- name: hv_positive
  location: DUT HV input
  family: Amphenol SurLok / equivalent
  mating_connector: TBD
  pin_count: 1
  keying: keyed
  voltage_rating_v: 1000
  current_rating_a: 120
  signal_type: HV power
  cable_type: orange HV cable
  shielding_grounding: chassis bonding per safety review
  strain_relief: fixture clamp
  required_optional: required
  risk_notes: Verify touch-safe cover and creepage/clearance.
- name: lv_control_header
  location: DUT LV connector
  family: Molex Micro-Fit / equivalent
  mating_connector: TBD
  pin_count: 12
  keying: polarized
  voltage_rating_v: 60
  current_rating_a: 8
  signal_type: LV power, CAN, enables, interlocks
  cable_type: shielded multi-conductor
  shielding_grounding: shield drain to fixture ground
  strain_relief: boot and cable tie
  required_optional: required
  risk_notes: Prevent swapped CAN and enable pins.
safety:
  controls:
  - All HV sources output OFF before connect/disconnect.
  - Electronic load input OFF before wiring changes.
  - E-stop path verified before energizing DUT.
  - Discharge verification completed before touch.
  safe_state_required: true
data:
  root: reports/bms-hil
requirements:
- BMS-REQ-001
- BMS-REQ-002
