name: quality

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
        env:
          PYTHONPATH: src

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distribution: [wheel, sdist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Clean-install built distribution
        shell: bash
        run: |
          python -m venv smoke-env
          if [[ "${{ matrix.distribution }}" == "wheel" ]]; then
            smoke-env/bin/python -m pip install dist/*.whl
          else
            smoke-env/bin/python -m pip install dist/*.tar.gz
          fi
      - name: Smoke console entry points
        run: |
          smoke-env/bin/lg-guide-test --help
          smoke-env/bin/lg-flash-openocd --help
          smoke-env/bin/lg-safe --help
